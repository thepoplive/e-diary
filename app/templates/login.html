<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Электронный дневник</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Электронный дневник</h1>
    <p class="sub">Войдите в систему</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label class="f"><span class="lbl">Логин</span>
        <input type="text" name="login" autofocus required>
      </label>
      <label class="f"><span class="lbl">Пароль</span>
        <input type="password" name="password" required>
      </label>
      <button class="btn" style="width:100%; justify-content:center; padding:11px">Войти</button>
    </form>
  </div>
</div>
</body>
</html>
